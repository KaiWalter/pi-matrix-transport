[package]
name = "pi-matrix-transport-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.100"
matrix-sdk = { version = "=0.16.0", features = ["bundled-sqlite"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.41"
tracing-subscriber = "=0.3.20"
